apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-ebs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  sources:
    - repoURL: https://github.com/serhii-myronets/terraform-talos-gitops-cluster.git
      targetRevision: homelab
      path: 03-gitops/apps/system/storage/openebs/app

    - repoURL: https://openebs.github.io/openebs
      chart: openebs
      targetRevision: 4.1.1
      helm:
        valueFiles:
          - $values/03-gitops/apps/system/storage/openebs/app/values.yaml

    - repoURL: https://github.com/serhii-myronets/terraform-talos-gitops-cluster.git
      targetRevision: homelab
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: openebs
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true