apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-runner-set-gha-rs-manager
  namespace: github-actions-runner-set
  labels:
    app.kubernetes.io/name: github-actions-runner-set
    app.kubernetes.io/instance: github-actions-runner-set
    app.kubernetes.io/version: "0.12.1"
    app.kubernetes.io/part-of: gha-rs
    actions.github.com/scale-set-name: github-actions-runner-set
    actions.github.com/scale-set-namespace: github-actions-runner-set
    app.kubernetes.io/component: manager-role
  annotations:
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - delete
      - get
  - apiGroups:
      - ""
    resources:
      - pods/status
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - create
      - delete
      - get
      - patch
      - update
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
    verbs:
      - create
      - delete
      - get
      - patch
      - update