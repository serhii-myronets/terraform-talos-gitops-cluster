# The two Python services take longer than their liveness probe allows to
# start serving gRPC within 200m of CPU - the probe has no initial delay and
# kills them after 15 s, over and over. A startup probe gives them a minute;
# the liveness probe only begins once it has passed.
- op: add
  path: /spec/template/spec/containers/0/startupProbe
  value:
    grpc: {port: 8080}
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 30
