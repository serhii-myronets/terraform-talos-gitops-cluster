# The shop. boutique.home on the LAN, with lab-ca's certificate, published to
# the router's BIND; boutique.serhii.link through the lab's tunnel, behind
# Cloudflare Access.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames:
    - boutique.home
    - boutique.serhii.link
  rules:
    - backendRefs:
        - {name: frontend, port: 80}
