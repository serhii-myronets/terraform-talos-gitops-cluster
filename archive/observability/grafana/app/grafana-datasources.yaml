apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-loki
  namespace: observability
  labels:
    grafana_datasource: "1"
data:
  datasource.yaml: |-
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        url: http://loki.observability.svc.cluster.local:3100
        access: proxy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-victoria-metrics
  namespace: observability
  labels:
    grafana_datasource: "1"
data:
  datasource.yaml: |-
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        url: http://victoria-metrics-server.observability.svc.cluster.local:8428
        access: proxy
        isDefault: true
        jsonData:
          prometheusType: Prometheus
          timeInterval: "15s"
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-tempo
  namespace: observability
  labels:
    grafana_datasource: "1"
data:
  datasource-tempo.yaml: |-
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        url: http://tempo.observability.svc.cluster.local:3200
        access: proxy