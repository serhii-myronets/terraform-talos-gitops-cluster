apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  # One per worker: each connector keeps four connections to Cloudflare, and
  # either worker can go down alone.
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cloudflared
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.3
          args: [tunnel, --config, /etc/cloudflared/config/config.yaml, run]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - {name: metrics, containerPort: 2000}
          readinessProbe:
            httpGet: {path: /ready, port: metrics}
          livenessProbe:
            httpGet: {path: /ready, port: metrics}
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/cloudflared/config, readOnly: true}
            - {name: credentials, mountPath: /etc/cloudflared/credentials, readOnly: true}
      volumes:
        - name: config
          configMap: {name: cloudflared-config}
        - name: credentials
          secret: {secretName: tunnel-credentials}
