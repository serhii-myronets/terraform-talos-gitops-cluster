apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: external-dns
    releaseName: external-dns
    version: 1.18.0
    repo: https://kubernetes-sigs.github.io/external-dns/
    namespace: external-dns
    valuesFile: values.yaml

resources:
  - namespace.yaml
  - cloudflare-api-token.yaml