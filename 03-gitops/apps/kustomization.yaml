# What Argo CD runs: one Application per line, each beside its own files in
# app/. Laid out as core's apps/ is - system/<category>/<name> and
# services/<name>.
#
# An application is listed only once it has been reviewed for the lab, and
# listing one is what deploys it. Those not yet reviewed wait outside apps/,
# in archive/awaiting-review.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # network
  - system/network/gateway-system/application.yaml
  - system/network/cloudflared/application.yaml
  - system/network/external-dns/application.yaml
  # security
  - system/security/external-secrets/application.yaml
  - system/security/cert-manager/application.yaml
  # storage
  - system/storage/proxmox-csi/application.yaml
  # platform
  - system/platform/argocd/application.yaml
  - system/platform/metrics-server/application.yaml
  - system/platform/cloudnative-pg/application.yaml
  # observability
  - system/observability/victoria-metrics/application.yaml
  - system/observability/hubble/application.yaml
