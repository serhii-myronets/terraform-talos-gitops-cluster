# The maps the application copies: zoning, FEMA flood zones, USGS water, the five
# counties' parcels and roads. Reference data that can be copied again from its sources,
# but that takes hours and depends on public servers that often refuse: it is backed up
# to R2 weekly (backup.yaml, decisions/0015). PostGIS for the spatial index.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: geo-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgis:17-3.5
  storage:
    size: 20Gi
    storageClass: proxmox-zfs
  bootstrap:
    initdb:
      database: geo
      owner: appraisal
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: r2-geo
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 2Gi}
  managed:
    # appraisal-dev's worker reads the maps as dev_reader: pg_read_all_data, no write
    # (appraisal-flow's decision 0021). Its password comes from Infisical (externalsecret.yaml).
    roles:
      - name: dev_reader
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        inRoles: [pg_read_all_data]
        connectionLimit: 5
        passwordSecret:
          name: geo-dev-reader
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: geo-db-lan
              annotations:
                lbipam.cilium.io/ips: 192.168.8.33
            spec:
              type: LoadBalancer
