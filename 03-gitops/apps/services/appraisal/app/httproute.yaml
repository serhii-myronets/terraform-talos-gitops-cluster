# whodb.home, LAN only (no serhii.link name), on the lab's Gateway; the name is in
# cert-manager's home-tls certificate.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whodb
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames:
    - whodb.home
  rules:
    - backendRefs:
        - {name: whodb, port: 80}
