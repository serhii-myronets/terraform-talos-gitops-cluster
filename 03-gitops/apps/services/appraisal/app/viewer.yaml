# The password of appraisal-db's read-only role viewer (whodb.yaml), from the lab's
# Infisical at /services/appraisal/appraisal-db/VIEWER_PASSWORD. CloudNativePG reads this secret
# for the managed role and, by the reload label, sets a changed password in the database.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: appraisal-db-viewer
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: appraisal-db-viewer
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: viewer
        password: "{{ .password }}"
  data:
    - {secretKey: password, remoteRef: {key: /services/appraisal/appraisal-db/VIEWER_PASSWORD}}
