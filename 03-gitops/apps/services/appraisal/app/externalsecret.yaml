# The application's secrets, from the lab's Infisical.
#
# r2-credentials: the R2 key pair for appraisal-db's and geo-db's backups (backup.yaml),
# at /system/backups, beside core's backups.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: r2-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: r2-credentials
  data:
    - {secretKey: ACCESS_KEY_ID, remoteRef: {key: /system/backups/R2_ACCESS_KEY_ID}}
    - {secretKey: SECRET_ACCESS_KEY, remoteRef: {key: /system/backups/R2_SECRET_ACCESS_KEY}}
---
# appraisal-db-viewer: the password of the read-only role viewer (appraisal-db.yaml, whodb.yaml),
# at /services/appraisal/DB_VIEWER_PASSWORD. CloudNativePG reads it for the managed role and,
# by the reload label, sets a changed password in the database.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: appraisal-db-viewer
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: appraisal-db-viewer
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: viewer
        password: "{{ .password }}"
  data:
    - {secretKey: password, remoteRef: {key: /services/appraisal/DB_VIEWER_PASSWORD}}
