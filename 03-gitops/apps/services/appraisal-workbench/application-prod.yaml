apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: appraisal-workbench
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  project: default
  # The owner's instance of the Appraisal Workbench, beside its databases in appraisal
  # (appraisal-flow's decision 0021), moved from the Mac on 2026-11-26. No automated
  # sync: a new version is synced by hand. Never a worker on the Mac against
  # appraisal-db while this one runs: both would take the same jobs.
  source:
    repoURL: https://github.com/serhii-myronets/terraform-talos-gitops-cluster.git
    targetRevision: homelab
    path: 03-gitops/apps/services/appraisal-workbench/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: appraisal
