# The API with the built web application. It listens on every interface without a token,
# by the owner's switch (appraisal-flow's decision 0022).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      imagePullSecrets: [{name: ghcr-pull}]
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/serhii-myronets/appraisal-api:main
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          envFrom:
            - secretRef: {name: app-secrets}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: db-app, key: uri}}
            - {name: STORAGE_URL, value: "s3://$(FILES_BUCKET)"}
            - {name: AWS_REGION, value: auto}
            - {name: ALLOWED_HOSTS, value: host.home}
            # No API token: reached only through the home network's gateway, which the
            # owner alone uses (appraisal-flow's decision 0022).
            - {name: OPEN_BEHIND_GATEWAY, value: "1"}
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - {name: capture, mountPath: /run/secrets/capture-token, readOnly: true}
          # The API answers only its own host names; the probe calls it as localhost.
          readinessProbe:
            httpGet: {path: /healthz, port: http, httpHeaders: [{name: Host, value: localhost}]}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: capture
          secret: {secretName: app-capture}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports:
    - {name: http, port: 80, targetPort: http}
