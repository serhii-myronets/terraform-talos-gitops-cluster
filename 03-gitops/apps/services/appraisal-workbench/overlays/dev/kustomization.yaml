# The development instance: its own database (db.yaml) and bucket, the maps read only.
# It follows the main branch's images (Argo CD Image Updater).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: appraisal-dev
resources:
  - ../../base
  - db.yaml
  - externalsecret.yaml
patches:
  - target: {kind: Deployment, name: worker}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: worker}
      spec:
        template:
          spec:
            initContainers:
              - name: migrate
                env:
                  - name: DATABASE_URL
                    valueFrom: {secretKeyRef: {name: appraisal-dev-db-app, key: uri}}
            containers:
              - name: worker
                env:
                  - name: DATABASE_URL
                    valueFrom: {secretKeyRef: {name: appraisal-dev-db-app, key: uri}}
                  # The maps: appraisal's geo-db, read as dev_reader (pg_read_all_data).
                  - name: GEO_DATABASE_URL
                    value: "postgresql://dev_reader:$(GEO_READER_PASSWORD)@geo-db-rw.appraisal.svc:5432/geo?sslmode=require"
  - target: {kind: Deployment, name: api}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: api}
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: DATABASE_URL
                    valueFrom: {secretKeyRef: {name: appraisal-dev-db-app, key: uri}}
                  - {name: ALLOWED_HOSTS, value: appraisal-dev.home}
  - target: {kind: HTTPRoute, name: api}
    patch: |-
      - {op: replace, path: /spec/hostnames, value: [appraisal-dev.home]}
