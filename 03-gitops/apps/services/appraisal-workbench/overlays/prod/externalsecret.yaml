# The owner's instance's secrets, from the lab's Infisical: the model's token, his bucket
# (appraisal-files, a token limited to it), the API's and the capture tokens.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: app-secrets
  data:
    - {secretKey: CLAUDE_CODE_OAUTH_TOKEN, remoteRef: {key: /services/appraisal/CLAUDE_CODE_OAUTH_TOKEN}}
    - {secretKey: FILES_BUCKET, remoteRef: {key: /services/appraisal/FILES_BUCKET}}
    - {secretKey: S3_ENDPOINT, remoteRef: {key: /services/appraisal/FILES_S3_ENDPOINT}}
    - {secretKey: AWS_ACCESS_KEY_ID, remoteRef: {key: /services/appraisal/FILES_ACCESS_KEY_ID}}
    - {secretKey: AWS_SECRET_ACCESS_KEY, remoteRef: {key: /services/appraisal/FILES_SECRET_ACCESS_KEY}}
    - {secretKey: API_TOKEN, remoteRef: {key: /services/appraisal/API_TOKEN}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-capture
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: app-capture
  data:
    - {secretKey: token, remoteRef: {key: /services/appraisal/CAPTURE_TOKEN}}
---
# Pulls the private images from GHCR (a token that can only read packages).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"serhii-myronets","password":"{{ .token }}","auth":"{{ printf "serhii-myronets:%s" .token | b64enc }}"}}}'
  data:
    - {secretKey: token, remoteRef: {key: /services/appraisal/GHCR_PULL_TOKEN}}
