# The owner's instance, beside its databases in appraisal (services/appraisal/app).
# Its builds are pinned: a new version is the digest of a main build already tried on
# appraisal-dev, written here when the owner says, then synced by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: appraisal
images:
  - name: ghcr.io/serhii-myronets/appraisal-api
    digest: sha256:2a09911cb3276bccde7e5faf44aded96d3d774d820ea67fc5723159fb318f6df
  - name: ghcr.io/serhii-myronets/appraisal-worker
    digest: sha256:ffbf8cef9a95ce7690c7c2039cf4709f833bd9ab9777620a77fea31bb21199dc
resources:
  - ../../base
  - externalsecret.yaml
patches:
  - target: {kind: Deployment, name: worker}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: worker}
      spec:
        template:
          spec:
            initContainers:
              - name: migrate
                env:
                  - name: DATABASE_URL
                    valueFrom: {secretKeyRef: {name: appraisal-db-app, key: uri}}
            containers:
              - name: worker
                env:
                  - name: DATABASE_URL
                    valueFrom: {secretKeyRef: {name: appraisal-db-app, key: uri}}
                  # The maps: geo-db beside it, as its owner (the worker copies maps into it).
                  - name: GEO_DATABASE_URL
                    valueFrom: {secretKeyRef: {name: geo-db-app, key: uri}}
  - target: {kind: Deployment, name: api}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: api}
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: DATABASE_URL
                    valueFrom: {secretKeyRef: {name: appraisal-db-app, key: uri}}
                  - {name: ALLOWED_HOSTS, value: appraisal.home}
  - target: {kind: HTTPRoute, name: api}
    patch: |-
      - {op: replace, path: /spec/hostnames, value: [appraisal.home]}
