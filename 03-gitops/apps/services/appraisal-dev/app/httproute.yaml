# appraisal-dev.home, LAN only, on the lab's Gateway; the name is in cert-manager's
# home-tls certificate.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames:
    - appraisal-dev.home
  rules:
    - backendRefs:
        - {name: api, port: 80}
