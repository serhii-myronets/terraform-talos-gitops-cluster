# The development instance's secrets, from the lab's Infisical (the owner puts them there;
# nothing is ever written to this repository).
#
# appraisal-dev: the model's token (the owner's subscription, appraisal-flow's
# tools/lab/claude-token.sh), the files' bucket (its own token, limited to that bucket),
# the API's token and the capture token for SingleFile. The bucket is dev's own
# (appraisal-files-dev, a token limited to it): dev cannot reach the owner's files.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: appraisal-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: appraisal-dev
  data:
    - {secretKey: CLAUDE_CODE_OAUTH_TOKEN, remoteRef: {key: /services/appraisal/CLAUDE_CODE_OAUTH_TOKEN}}
    - {secretKey: FILES_BUCKET, remoteRef: {key: /services/appraisal-dev/FILES_BUCKET}}
    - {secretKey: S3_ENDPOINT, remoteRef: {key: /services/appraisal-dev/FILES_S3_ENDPOINT}}
    - {secretKey: AWS_ACCESS_KEY_ID, remoteRef: {key: /services/appraisal-dev/FILES_ACCESS_KEY_ID}}
    - {secretKey: AWS_SECRET_ACCESS_KEY, remoteRef: {key: /services/appraisal-dev/FILES_SECRET_ACCESS_KEY}}
    - {secretKey: API_TOKEN, remoteRef: {key: /services/appraisal-dev/API_TOKEN}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: appraisal-dev-capture
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: appraisal-dev-capture
  data:
    - {secretKey: token, remoteRef: {key: /services/appraisal-dev/CAPTURE_TOKEN}}
---
# Pulls the private images from GHCR (a token that can only read packages).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"serhii-myronets","password":"{{ .token }}"}}}'
  data:
    - {secretKey: token, remoteRef: {key: /services/appraisal/GHCR_PULL_TOKEN}}
