# Kafbat UI 1.5, the community's continuation of provectus/kafka-ui: topics,
# messages, consumer groups and their lag, for any number of clusters.
# Chosen over Redpanda Console on 2026-10-04: Apache 2.0 with every feature
# free, where Console is source-available with SSO and RBAC paid for.
yamlApplicationConfig:
  kafka:
    clusters:
      - name: otel-demo
        bootstrapServers: kafka-kafka-bootstrap:9092
  # No login of its own: the LAN, or Cloudflare Access for the public name.
  auth:
    type: disabled
  management:
    health:
      ldap:
        enabled: false

resources:
  requests: {cpu: 10m, memory: 256Mi}
  limits: {memory: 512Mi}

fullnameOverride: kafbat-ui
