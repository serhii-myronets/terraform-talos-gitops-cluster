apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: otel-demo
resources:
  - namespace.yaml
  - kafka.yaml
  - httproute-kafka-ui.yaml
helmCharts:
  - name: kafka-ui
    repo: https://kafbat.github.io/helm-charts
    version: 1.6.5
    releaseName: kafbat-ui
    namespace: otel-demo
    valuesFile: values-kafbat-ui.yaml
