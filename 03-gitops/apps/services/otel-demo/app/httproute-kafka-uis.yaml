# The two Kafka UIs. <name>.home on the LAN, with lab-ca's certificate,
# published to the router's BIND; <name>.serhii.link through the lab's
# tunnel, behind Cloudflare Access. Neither UI has a login of its own.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redpanda-console
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames:
    - redpanda.home
    - redpanda.serhii.link
  rules:
    - backendRefs:
        - {name: redpanda-console, port: 8080}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kafbat-ui
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames:
    - kafbat.home
    - kafbat.serhii.link
  rules:
    - backendRefs:
        - {name: kafbat-ui, port: 80}
