apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-demo
  namespace: argocd
  annotations:
    # Compare with what the API server would store: it fills in an
    # HTTPRoute's defaults - group, kind, weight, the match on / - which a
    # client-side diff of the YAML counts as a change.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  # The OpenTelemetry demo shop, on the lab's own operators: its Kafka run
  # by Strimzi, its Postgres by CloudNativePG. For now the Kafka alone.
  source:
    repoURL: https://github.com/serhii-myronets/terraform-talos-gitops-cluster.git
    targetRevision: homelab
    path: 03-gitops/apps/services/otel-demo/app
  destination:
    server: https://kubernetes.default.svc
    namespace: otel-demo
  syncPolicy:
    automated: {}
    syncOptions:
      - ServerSideApply=true
