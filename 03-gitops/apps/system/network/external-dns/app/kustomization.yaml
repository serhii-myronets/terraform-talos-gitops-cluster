apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-dns
resources:
  - externalsecret-cloudflare.yaml
  - externalsecret-bind.yaml
# Two external-dns from one chart, as core has: one process takes one
# provider. external-dns writes serhii.link to Cloudflare, external-dns-bind
# writes .home to the router's BIND.
helmCharts:
  - name: external-dns
    repo: https://kubernetes-sigs.github.io/external-dns/
    version: 1.23.0
    releaseName: external-dns
    namespace: external-dns
    valuesFile: values-cloudflare.yaml
  - name: external-dns
    repo: https://kubernetes-sigs.github.io/external-dns/
    version: 1.23.0
    releaseName: external-dns-bind
    namespace: external-dns
    valuesFile: values-bind.yaml
