apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  # Only what sits on top of Argo CD - its route. Argo CD itself is
  # 02-bootstrap's Helm release, upgraded with helmfile as Cilium and External
  # Secrets are, not by itself (docs/decisions/0003).
  source:
    repoURL: https://github.com/serhii-myronets/terraform-talos-gitops-cluster.git
    targetRevision: homelab
    path: 03-gitops/apps/system/platform/argocd/app
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {}
