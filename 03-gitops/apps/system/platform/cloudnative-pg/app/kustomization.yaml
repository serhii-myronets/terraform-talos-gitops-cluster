apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: 0.29.1
    releaseName: cloudnative-pg
    namespace: cnpg-system
    includeCRDs: true
    valuesFile: values.yaml
  # Its backups: base backups and the WAL archive to an object store, here the lab's
  # prefix in R2 (decisions/0014). Its certificates come from cert-manager.
  - name: plugin-barman-cloud
    repo: https://cloudnative-pg.github.io/charts
    version: 0.8.1
    releaseName: plugin-barman-cloud
    namespace: cnpg-system
    includeCRDs: true
    valuesFile: values-barman-cloud.yaml
