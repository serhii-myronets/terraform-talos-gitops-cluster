# The token that can only read GHCR's packages (Infisical), as a pull secret in argocd for
# the updater; appraisal-dev has its own copy for its pods.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"serhii-myronets","password":"{{ .token }}"}}}'
  data:
    - {secretKey: token, remoteRef: {key: /services/appraisal/GHCR_PULL_TOKEN}}
