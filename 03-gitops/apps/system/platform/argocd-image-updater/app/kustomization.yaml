apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - externalsecret.yaml
  - appraisal-dev.yaml
helmCharts:
  # 1.x configures what it follows with ImageUpdater resources, not annotations.
  - name: argocd-image-updater
    repo: https://argoproj.github.io/argo-helm
    version: 1.4.2
    releaseName: argocd-image-updater
    namespace: argocd
    includeCRDs: true
    valuesFile: values.yaml
