# Strimzi 1.2. One operator for the whole cluster: a Kafka resource in any
# namespace is its to run.
watchAnyNamespace: true

# A Java process: the memory is the chart's own, which it needs; the CPU
# request is smaller, as it idles between reconciliations.
resources:
  requests:
    cpu: 50m
    memory: 384Mi
  limits:
    memory: 384Mi
