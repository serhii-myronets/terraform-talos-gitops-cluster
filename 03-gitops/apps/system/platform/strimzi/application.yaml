apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
spec:
  project: default
  # The Kafka operator: it runs a Kafka cluster for each Kafka resource it
  # finds, in any namespace, and keeps its topics and users from KafkaTopic
  # and KafkaUser resources. The clusters are not here - each lives with
  # whatever uses it, in that application's app/.
  source:
    repoURL: https://github.com/serhii-myronets/terraform-talos-gitops-cluster.git
    targetRevision: homelab
    path: 03-gitops/apps/system/platform/strimzi/app
  destination:
    server: https://kubernetes.default.svc
    namespace: strimzi
  syncPolicy:
    automated: {}
    syncOptions:
      # The CRDs are larger than the annotation a client-side apply keeps
      # the last configuration in.
      - ServerSideApply=true
