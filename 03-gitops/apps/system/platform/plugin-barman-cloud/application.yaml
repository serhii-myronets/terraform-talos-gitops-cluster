apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plugin-barman-cloud
  namespace: argocd
  annotations:
    # After the operator and cert-manager, before any database that backs up.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  # CloudNativePG's backups: base backups and the WAL archive to an object store,
  # here the lab's prefix in R2 (decisions/0014).
  source:
    repoURL: https://github.com/serhii-myronets/terraform-talos-gitops-cluster.git
    targetRevision: homelab
    path: 03-gitops/apps/system/platform/plugin-barman-cloud/app
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated: {}
    syncOptions:
      - ServerSideApply=true
