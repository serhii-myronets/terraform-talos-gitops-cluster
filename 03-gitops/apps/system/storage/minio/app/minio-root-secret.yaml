apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-root-secret
  namespace: minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-cloud
    kind: ClusterSecretStore
  target:
    name: minio-root-secret
    creationPolicy: Owner
  data:
    - secretKey: rootUser
      remoteRef:
        key: /system/minio/ROOT_USER
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: rootPassword
      remoteRef:
        key: /system/minio/ROOT_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None