mode: standalone
existingSecret: minio-root-secret

buckets:
  - name: buildkit-cache
    policy: none
    purge: false
    versioning: false
  - name: loki-admin
    policy: none
    purge: false
  - name: logs-cold-storage
    policy: none
    purge: false

users:
  - accessKey: minio-user
    existingSecret: minio-access-secret
    existingSecretKey: secretkey
    policy: access-policy

policies:
  - name: access-policy
    statements:
      - effect: Allow
        resources:
          - "arn:aws:s3:::*/*"
        actions:
          - "s3:AbortMultipartUpload"
          - "s3:GetObject"
          - "s3:DeleteObject"
          - "s3:PutObject"
          - "s3:ListMultipartUploadParts"
      - effect: Allow
        resources:
          - "arn:aws:s3:::*"
        actions:
          - "s3:GetBucketLocation"
          - "s3:ListBucket"
          - "s3:ListBucketMultipartUploads"

persistence:
  enabled: true
  size: 10Gi
  storageClass: local-nvme

consoleService:
  type: ClusterIP
  port: 9001

service:
  type: ClusterIP
  port: 9000

resources:
  requests:
    memory: 512Mi
    cpu: 250m