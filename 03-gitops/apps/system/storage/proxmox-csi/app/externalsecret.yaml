apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-csi-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: proxmox-csi-config
    template:
      engineVersion: v2
      data:
        # region is the topology.kubernetes.io/region every node carries
        # (01-infrastructure/locals.tf). The host's certificate is its own
        # self-signed one.
        config.yaml: |
          clusters:
            - url: https://192.168.8.30:8006/api2/json
              insecure: true
              token_id: "{{ .tokenId }}"
              token_secret: "{{ .tokenSecret }}"
              region: proxmox
  data:
    - secretKey: tokenId
      remoteRef: {key: /system/proxmox-csi/TOKEN_ID}
    - secretKey: tokenSecret
      remoteRef: {key: /system/proxmox-csi/TOKEN_SECRET}
