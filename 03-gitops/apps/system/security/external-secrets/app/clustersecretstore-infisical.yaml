apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-cloud
spec:
  provider:
    infisical:
      hostAPI: "https://app.infisical.com"
      # As the identity lab, with this cluster's own ServiceAccount token
      # (serviceaccount-infisical.yaml) - no secret placed by hand.
      auth:
        jwtAuthCredentials:
          identityId:
            name: infisical-identity
            namespace: external-secrets
            key: identityId
          jwt:
            name: infisical-token
            namespace: external-secrets
            key: token
      secretsScope:
        projectSlug: proxmox-lab
        environmentSlug: prod
        secretsPath: /