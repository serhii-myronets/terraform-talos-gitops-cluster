# What External Secrets logs in to Infisical with, and nothing in it is a
# secret (docs/decisions/0011). The ServiceAccount infisical exists only to
# be named in a token; Kubernetes fills the Secret infisical-token below with
# a long-lived token for it, signed with the cluster's ServiceAccount key.
# Infisical's identity lab holds that key's public half and accepts a token
# whose subject is system:serviceaccount:external-secrets:infisical.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical
  namespace: external-secrets
---
# Empty in Git: kube-controller-manager writes the token into it.
apiVersion: v1
kind: Secret
metadata:
  name: infisical-token
  namespace: external-secrets
  annotations:
    kubernetes.io/service-account.name: infisical
type: kubernetes.io/service-account-token
---
# Which identity the token logs in as. Not secret; a Secret only because the
# ClusterSecretStore takes the ID from one.
apiVersion: v1
kind: Secret
metadata:
  name: infisical-identity
  namespace: external-secrets
stringData:
  identityId: 0bd1c420-c899-47c2-89ca-1bca02fb12f4 # lab
