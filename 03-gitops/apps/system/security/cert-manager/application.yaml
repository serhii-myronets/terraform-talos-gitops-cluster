apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  # The chart, lab-ca and the Gateway's certificate are in app/kustomization.yaml.
  source:
    repoURL: https://github.com/serhii-myronets/terraform-talos-gitops-cluster.git
    targetRevision: homelab
    path: 03-gitops/apps/system/security/cert-manager/app
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
      # The CRDs are too large for a client-side apply's annotation, and were
      # first applied server-side by 02-bootstrap's prepare hook.
      - ServerSideApply=true
    # The issuer and the certificate need cert-manager's webhook, which the
    # first sync is still starting.
    retry:
      limit: 5
      backoff: {duration: 20s, factor: 2, maxDuration: 3m}
