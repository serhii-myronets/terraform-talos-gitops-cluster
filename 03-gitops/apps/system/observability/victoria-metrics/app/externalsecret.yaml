# What the agents show core's ingest.home: the lab's token, which lets them
# write and nothing else, and home-ca's root, to trust the certificate core's
# Gateway presents. Core holds the same token at
# /system/observability/LAB_INGEST_TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ingest
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: ingest
  data:
    - secretKey: token
      remoteRef: {key: /system/observability/INGEST_TOKEN}
    - secretKey: ca.crt
      remoteRef: {key: /system/lab-ca/CA_CRT}
