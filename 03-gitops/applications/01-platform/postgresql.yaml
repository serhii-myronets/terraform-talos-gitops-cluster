apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  sources:
    - repoURL: https://github.com/serhii-myronets/terraform-talos-gitops-cluster.git
      targetRevision: homelab
      path: 03-gitops/components/01-platform/postgresql

    - repoURL: https://charts.bitnami.com/bitnami
      chart: postgresql
      targetRevision: 18.5.1
      helm:
        valueFiles:
          - $values/03-gitops/components/01-platform/postgresql/values.yaml

    - repoURL: https://github.com/serhii-myronets/terraform-talos-gitops-cluster.git
      targetRevision: homelab
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: postgresql
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true