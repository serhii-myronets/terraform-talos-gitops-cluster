apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: core
  # Two external-dns from one chart, as core has: one process takes one
  # provider. external-dns writes serhii.link to Cloudflare, external-dns-bind
  # writes .home to the router's BIND.
  sources:
    # Their credentials: the Cloudflare token and the BIND TSIG key
    - repoURL: https://github.com/serhii-myronets/terraform-talos-gitops-cluster.git
      targetRevision: homelab
      path: 03-gitops/components/00-core/external-dns
      directory:
        exclude: "values-*.yaml"

    - repoURL: https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      targetRevision: 1.23.0
      helm:
        releaseName: external-dns
        valueFiles:
          - $values/03-gitops/components/00-core/external-dns/values-cloudflare.yaml

    - repoURL: https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      targetRevision: 1.23.0
      helm:
        releaseName: external-dns-bind
        valueFiles:
          - $values/03-gitops/components/00-core/external-dns/values-bind.yaml

    - repoURL: https://github.com/serhii-myronets/terraform-talos-gitops-cluster.git
      targetRevision: homelab
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
