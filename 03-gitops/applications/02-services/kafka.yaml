apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: services
  source:
    repoURL: https://github.com/serhii-myronets/terraform-talos-gitops-cluster.git
    targetRevision: homelab
    path: 03-gitops/components/02-services/kafka
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true