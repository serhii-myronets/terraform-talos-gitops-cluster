apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/serhii-myronets/terraform-talos-gitops-cluster.git
    targetRevision: homelab
    path: 03-gitops/applications/00-core
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {}