# The lab's cluster as it runs. Facts about the Proxmox host, the network and
# the router are in the homelab repository (docs/hosts/proxmox.yaml,
# docs/network.yaml, docs/hosts/router.yaml). Verified 2026-10-03.

meta:
  updated: 2026-10-03
  tags: [lab, talos, kubernetes, cilium, argocd, external-secrets, external-dns]

cluster:
  name: lab                         # the context lab, for talosctl and kubectl alike
  api: https://192.168.8.50:6443    # Layer2 VIP on the control planes' lan link
  talos: v1.14.1                    # contract v1.14 - decisions/0002
  kubernetes: v1.37.0
  built_by: 01-infrastructure, Terraform, state in R2 (homelab-backups,
    terraform/lab-01-infrastructure.tfstate)
  nodes:
    - {name: controlplane-1, ip: 192.168.8.40, vm: 140, cpu: 4, memory_gb: 4}
    - {name: controlplane-2, ip: 192.168.8.41, vm: 141, cpu: 4, memory_gb: 4}
    - {name: controlplane-3, ip: 192.168.8.42, vm: 142, cpu: 4, memory_gb: 4}
    - {name: worker-1, ip: 192.168.8.45, vm: 145, cpu: 8, memory_gb: 18}
    - {name: worker-2, ip: 192.168.8.46, vm: 146, cpu: 8, memory_gb: 18}
  topology: every node labelled region proxmox, zone proxmox - Proxmox CSI places volumes by them

bootstrap:                          # 02-bootstrap, Helmfile, context lab
  cilium: 1.20.2                    # kube-proxy replacement, BPF masquerade, Gateway API
  external-secrets: 2.11.0
  argo-cd: 10.9.6                   # Argo CD v3.5.3; anonymous admin
  gateway_api_crds: v1.6.2
  root_application: 03-gitops/root.yaml, applied by the postsync hook

network:
  gateway: main-gateway at 192.168.8.31   # Cilium LB pool 192.168.8.31-35, L2 from the workers
  listeners: >-
    As core's: http for *.serhii.link, what the tunnel carries; http-home,
    *.home on 80, redirecting to HTTPS; https, *.home on 443 with home-tls.
  certificate: >-
    home-tls in gateway-system, issued by cert-manager's ClusterIssuer lab-ca
    - an intermediate under home-ca limited to .home, valid to 2031-10-03
    (decisions/0006). Lists the lab's .home names; devices trust it through
    home-ca.
  tunnel: lab (62ed916d-9072-479d-aa94-263edf64f262), two connectors
  external_dns:
    external-dns: serhii.link in Cloudflare, proxied CNAME to the tunnel, owner lab
    external-dns-bind: .home in the router's BIND over RFC 2136, key lab, owner lab

storage:
  driver: Proxmox CSI, chart 0.5.12 - decisions/0007
  classes: >-
    proxmox-zfs (default, Delete) and proxmox-zfs-retain (Retain), both on
    local-zfs, XFS. A volume is a zvol vm-9999-pvc-<uuid> attached to the
    worker that runs its pod.
  proxmox_user: kubernetes-csi@pve, token csi, role CSI (VM.Audit, VM.Config.Disk, Datastore.*)

secrets:
  infisical_project: proxmox-lab, environment prod
  identity: lab, read-only on proxmox-lab, logged in by the cluster's own ServiceAccount token - decisions/0004, 0011
  store: ClusterSecretStore infisical-cloud
  keys: >-
    /system/cloudflare (TUNNEL_CREDENTIALS, DNS_API_TOKEN), /system/bind
    (TSIG_KEY, TSIG_SECRET), /system/lab-ca (TLS_CRT, TLS_KEY, CA_CRT),
    /system/proxmox-csi (TOKEN_ID, TOKEN_SECRET), /system/observability
    (INGEST_TOKEN, write-only on core - decisions/0008), /system/proxmox (API_TOKEN, Terraform's,
    root@pam!terraform - decisions/0012), /system/talos
    (SECRETS_YAML, what the cluster is made from; TALOSCONFIG and KUBECONFIG,
    written by Terraform - decisions/0010), /system/minio,
    /system/postgresql
  written_to_core: >-
    The admin kubeconfig again, into core's project at
    /system/headlamp/LAB_KUBECONFIG, for core's Headlamp, which shows the
    lab as the context lab (01-infrastructure/clients.tf; the homelab repository's
    decisions/0042).

applications:                       # 03-gitops/apps/kustomization.yaml - decisions/0005
  running:
    - system/network/gateway-system
    - system/network/cloudflared
    - system/network/external-dns
    - system/security/external-secrets
    - system/security/cert-manager       # v1.21.2
    - system/storage/proxmox-csi         # chart 0.5.12
    - system/platform/argocd             # its route only; Argo CD is 02-bootstrap's
    - system/platform/metrics-server     # chart 3.14.0
    - system/platform/strimzi            # chart 1.2.0, watching every namespace
    - system/platform/cloudnative-pg     # chart 0.29.1, operator 1.30.1; no databases yet, no backup plugin until R2
    - system/observability/victoria-metrics  # chart 0.95.0, agents only, writing to core - decisions/0008
    - system/observability/hubble        # its route only, hubble.home and .serhii.link; Hubble is Cilium's, in 02-bootstrap
  waiting_for_review:                # in archive/awaiting-review, outside apps/
    - minio                          # was system/storage
    - postgresql                     # was system/platform
