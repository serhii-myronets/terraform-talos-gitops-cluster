# Pinned to the lab's kubeconfig context, hooks included: they run plain
# kubectl, which would otherwise use whatever context is current - core's, on
# this Mac.
helmDefaults:
  kubeContext: admin@lab

repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm
  - name: cilium
    url: https://helm.cilium.io
  - name: external-secrets
    url: https://charts.external-secrets.io

hooks:
  # Runs before every command, diff included - see
  # helmfile-diff-applies-the-prepare-hook in the homelab repository's
  # docs/traps.yaml. Idempotent.
  - events: ["prepare"]
    showlogs: true
    command: kubectl
    args: ["--context", "admin@lab", "apply", "-k", "./prepare-hook/", "--server-side"]

releases:
  - name: cilium
    namespace: kube-system
    chart: cilium/cilium
    version: 1.20.2
    values:
      - values/cilium-values.yaml

  # Before Argo CD, so every ExternalSecret in 03-gitops finds a running
  # controller. Its ClusterSecretStore is Argo CD's, in
  # 03-gitops/apps/system/security/external-secrets.
  - name: external-secrets
    namespace: external-secrets
    chart: external-secrets/external-secrets
    version: 2.11.0
    needs:
      - kube-system/cilium
    values:
      - values/external-secrets-values.yaml

  # Argo CD is upgraded here, as Cilium and External Secrets are - not by
  # itself; 03-gitops/apps/system/platform/argocd holds only its route
  # (docs/decisions/0003).
  - name: argocd
    namespace: argocd
    chart: argo/argo-cd
    version: 10.9.6
    needs:
      - external-secrets/external-secrets
    values:
      - values/argocd-values.yaml
    hooks:
      # The root Application, from which Argo CD runs what
      # 03-gitops/apps/kustomization.yaml lists.
      - events: ["postsync"]
        showlogs: true
        command: kubectl
        args: ["--context", "admin@lab", "apply", "-f", "../03-gitops/root.yaml"]
