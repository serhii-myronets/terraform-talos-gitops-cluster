# Read by the bootstrap release and by the Application through which Argo CD
# manages itself (03-gitops/applications/00-core/argocd.yaml).

# The chart installs and upgrades its own CRDs, and keeps them on uninstall.
crds:
  install: true
  keep: true

# Login as admin, with the password in the secret argocd-initial-admin-secret.
# Anonymous admin access is off: the UI has had a public route.
configs:
  cm:
    kustomize.buildOptions: "--enable-helm"

# TLS ends at the Cilium Gateway.
server:
  extraArgs:
    - --insecure

# Not used here: no external login, no notifications, no ApplicationSets.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0

controller:
  metrics:
    enabled: true
