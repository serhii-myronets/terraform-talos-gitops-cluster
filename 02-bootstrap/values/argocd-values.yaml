# Argo CD's only values: helmfile installs and upgrades it, and nothing in
# 03-gitops manages it (docs/decisions/0003).

# The chart installs and upgrades its own CRDs, and keeps them on uninstall.
crds:
  install: true
  keep: true

# Anonymous admin, no login: a lab. Its public route is behind Cloudflare
# Access, and the rest of it answers on the LAN only.
configs:
  cm:
    kustomize.buildOptions: "--enable-helm"
    users.anonymous.enabled: "true"
  rbac:
    policy.default: role:admin

# TLS ends at the Cilium Gateway.
server:
  extraArgs:
    - --insecure

# Not used here: no external login, no notifications, no ApplicationSets.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0

controller:
  metrics:
    enabled: true
