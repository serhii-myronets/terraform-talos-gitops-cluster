# As core's (core/02-platform/values/external-secrets-values.yaml in the
# homelab repository). The controller reconciles ExternalSecret and
# SecretStore resources. Conversion is disabled, so it needs no admission
# webhook or its certificate controller.
webhook:
  create: false

certController:
  create: false

# The chart owns its CRDs, so the controller and its API definitions stay on
# one version.
installCRDs: true

# A memory limit on every container keeps Talos's OOM controller off it.
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
